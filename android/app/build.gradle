plugins {
    id 'com.android.application'
    id 'kotlin-android'
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id 'dev.flutter.flutter-gradle-plugin'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.maquizta.app"
    compileSdkVersion 36   // ⬅️ better to set explicitly (not flutter.compileSdkVersion)
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11.toString()
    }

    defaultConfig {
        applicationId "com.ua.maqUiztA"
        minSdkVersion flutter.minSdkVersion     // ⬅️ safer to set explicitly (instead of flutter.minSdkVersion)
        targetSdkVersion 35  // ⬅️ required by Play Store
        versionCode 6
        versionName "2.0.2"
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release

            // ✅ Enable code shrinking, obfuscation, and resource shrinking
            minifyEnabled true
            shrinkResources true

            // ✅ Use the default optimized ProGuard rules + your own rules
            proguardFiles getDefaultProguardFile(
                'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

}

flutter {
    source '../..'
}
